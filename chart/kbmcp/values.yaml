# Placeholder userspace paths for helm lint/template. Olares overwrites these at install.
userspace:
  appData: /Users/placeholders/appdata
  userData: /Users/placeholders/Home

# Olares injects userspace / user / svcs on top of this file at install time.
workloads:
  kbmcp:
    replicaCount: 1

image:
  repository: ghcr.io/wooj-commits/kb-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Filled at package/install time. Leave placeholders empty in the template chart.
env:
  # Apps-in-Olares Router base URL including /v1 (example: http://<id>.shared.olares.com/v1)
  ROUTER_BASE_URL: "https://router.woojinc1205.olares.com/v1"
  ROUTER_API_KEY: "olares"
  # Full Router model names, copied from Router after install
  CHAT_MODEL: "Olares/unsloth/Qwen3.6-27B-GGUF:Q4_K_M"
  EMBED_MODEL: "Olares/embeddinggemma-300m"
  # Comma-separated name:token pairs. Empty here on purpose — bake in via build-package.sh.
  MCP_TOKENS: ""
  # Public hostname(s) for DNS-rebinding protection, e.g. kb.woojinc1205.olares.com
  MCP_ALLOWED_HOSTS: "kb.woojinc1205.olares.com,b336a42a.woojinc1205.olares.com"
  KB_SOURCE_DIR: "/kb/articles"
  KB_DATA_DIR: "/app/data"
  KB_SYNC_INTERVAL: "900"
  MCP_RATE_LIMIT: "60"
  LOG_LEVEL: "INFO"

resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi
